services:
  - type: web
    name: mathbridge
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MATHBRIDGE_DATA_DIR
        value: /var/data
      - key: MATHBRIDGE_SECURE_COOKIES
        value: "1"
    disk:
      name: mathbridge-data
      mountPath: /var/data
      sizeGB: 1
